version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: mipacs_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --app-dir backend --reload
    ports:
      - "8000:8000"
      - "11112:11112"
    depends_on:
      - db
    volumes:
      - .:/app 
      # 🔥 Conectamos tus discos físicos al contenedor Linux
      - "D:/MI_PACS_NAS_EXTERNAL:/mnt/nas_externo"     

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "5173:5173"
    restart: always

volumes:
  postgres_data: