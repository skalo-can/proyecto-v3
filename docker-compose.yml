version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: mipacs_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --app-dir backend --reload
    ports:
      - "8000:8000"
      - "11112:11112"
    depends_on:
      - db
    volumes:
      - .:/app 
      # 🔥 AQUÍ ESTÁ LA MAGIA: Conectamos tus discos físicos de Windows al contenedor Linux
      - "H:/:/mnt/usb_h"  # <-- Usar comillas y barra normal
      - D:\:/mnt/usb_d
      - E:\:/mnt/usb_e

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data: